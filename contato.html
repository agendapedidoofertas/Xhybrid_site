<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato — Xhybrid</title>
  <script>
    (function () {
      var hash = "#contato";
      var path = location.pathname.replace(/\/(?:sobre|galeria|contato)\.html$/i, "");
      if (!path || path === "/") location.replace("index.html" + hash);
      else location.replace(path + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=index.html#contato">
</head>
<body data-page="contato">
  <p><a href="index.html#contato">Ir para Contato</a></p>
</body>
</html>
