<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — 8xd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="admin">
  <div class="page">
    <header class="site-header">
      <div class="container site-header__inner">
        <div class="admin-brand">
          <a class="admin-back" href="/planos.html" title="Voltar aos planos" aria-label="Voltar aos planos">←</a>
        </div>
        <p class="admin-user">8xd · Checkout</p>
      </div>
    </header>

    <main class="container admin-main">
      <header class="page-header" style="padding-top:0;text-align:left;margin:0;max-width:none;">
        <p class="eyebrow">Contratação</p>
        <h1 class="font-display">Checkout</h1>
        <p id="plan-label" class="text-muted">Escolha um plano em <a href="/planos.html">planos</a>.</p>
      </header>

      <form id="checkout-form" class="contact-form admin-form" style="margin-top:1.5rem;">
        <div class="form-group">
          <label for="company">Nome da empresa</label>
          <input id="company" name="company" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" class="form-input" required>
        </div>
        <input type="hidden" name="plan" id="plan" value="basic">
        <input type="hidden" name="provider" id="provider" value="asaas">
        <label class="admin-check" style="align-items:flex-start;cursor:pointer;">
          <input type="checkbox" id="terms_accepted" required style="margin-top:0.2rem;">
          <span class="planos-legal" style="font-size:0.9rem;line-height:1.4;">
            Confirmo que li e concordo com os
            <a href="/termos.html" id="checkout-open-termos">Termos de Serviço</a>
            e a <a href="/privacidade.html" id="checkout-open-privacy">Privacidade</a>.
          </span>
        </label>
        <p style="margin-top:1.25rem;">
          <button class="btn btn-primary" type="submit">Continuar</button>
        </p>
      </form>
      <p id="checkout-status" class="text-muted" style="margin-top:1rem;font-size:0.9rem;"></p>
    </main>
  </div>

  <div class="planos-modal" id="legal-modal" hidden role="dialog" aria-modal="true" aria-labelledby="legal-modal-title" style="position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:1rem;background:rgba(0,0,0,.7);">
    <div style="width:min(42rem,100%);max-height:min(82vh,40rem);display:flex;flex-direction:column;background:#141414;color:#f5f5f5;border:1px solid #2a2a2a;border-radius:.75rem;overflow:hidden;">
      <div style="padding:1.15rem 1.25rem .75rem;border-bottom:1px solid #2a2a2a;">
        <h2 id="legal-modal-title" class="font-display" style="margin:0;font-size:1.2rem;">Documento</h2>
      </div>
      <div id="legal-modal-body" style="padding:1rem 1.25rem;overflow:auto;font-size:.9rem;line-height:1.55;color:#d4d4d4;flex:1;min-height:0;"></div>
      <div style="display:flex;flex-wrap:wrap;gap:.65rem;padding:.85rem 1.25rem 1.1rem;border-top:1px solid #2a2a2a;">
        <button type="button" class="btn btn-primary" id="legal-modal-close">Fechar</button>
        <button type="button" class="btn btn-outline" id="legal-modal-full">Ver texto completo</button>
      </div>
    </div>
  </div>
  <style>
    #legal-modal[hidden] { display: none !important; }
    body[data-page="admin"] .planos-legal a,
    body[data-page="admin"] .planos-legal a:hover,
    body[data-page="admin"] .planos-legal a:visited {
      color: #6cb2ff !important;
      text-decoration: underline !important;
      text-underline-offset: 0.15em;
      text-decoration-thickness: 1px;
    }
  </style>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const aliases = { medium: 'pleno', pro: 'plus' };
      let plan = (params.get('plan') || 'basic').toLowerCase();
      if (aliases[plan]) plan = aliases[plan];
      const allowed = ['basic', 'pleno', 'plus'];
      const p = allowed.includes(plan) ? plan : 'basic';
      let provider = (params.get('provider') || 'asaas').toLowerCase();
      if (!['asaas', 'stripe'].includes(provider)) provider = 'asaas';
      const termsOk = params.get('terms') === '1';

      document.getElementById('plan').value = p;
      document.getElementById('provider').value = provider;
      const labels = { basic: 'Basic', pleno: 'Pleno', plus: 'Plus' };
      document.getElementById('plan-label').textContent =
        'Plano: ' + labels[p] + ' · Pagamento: ' + (provider === 'stripe' ? 'Stripe' : 'Asaas');
      if (termsOk) {
        document.getElementById('terms_accepted').checked = true;
      }

      const modal = document.getElementById('legal-modal');
      const modalBody = document.getElementById('legal-modal-body');
      const modalTitle = document.getElementById('legal-modal-title');
      const fullBtn = document.getElementById('legal-modal-full');
      let kind = 'terms';
      let mode = 'summary';
      let offerCache = null;
      const fullCache = { terms: '', privacy: '' };

      function escapeHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function summaryHtml(text) {
        return String(text || '')
          .split(/\n\s*\n/)
          .map(function (x) { return x.trim(); })
          .filter(Boolean)
          .map(function (x) {
            return '<p>' + escapeHtml(x).replace(/\n/g, '<br>') + '</p>';
          })
          .join('') || '<p>Documento indisponível.</p>';
      }
      function meta() {
        const d = offerCache || {};
        if (kind === 'privacy') {
          return {
            titleS: 'Privacidade / LGPD (resumo)',
            titleF: 'Política de Privacidade (LGPD)',
            summary: d.privacy_summary || '',
            url: d.privacy_url || '/privacidade.html',
          };
        }
        return {
          titleS: 'Termos de Serviço (resumo)',
          titleF: 'Termos de Serviço',
          summary: d.terms_summary || '',
          url: d.terms_url || '/termos.html',
        };
      }
      function showSummary() {
        const m = meta();
        mode = 'summary';
        modalTitle.textContent = m.titleS;
        modalBody.innerHTML = summaryHtml(m.summary);
        fullBtn.textContent = 'Ver texto completo';
      }
      function showFull() {
        const m = meta();
        mode = 'full';
        modalTitle.textContent = m.titleF;
        fullBtn.textContent = 'Ver resumo';
        if (fullCache[kind]) {
          modalBody.innerHTML = fullCache[kind];
          return;
        }
        modalBody.innerHTML = '<p>Carregando…</p>';
        fetch(m.url)
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var main = doc.querySelector('main') || doc.body;
            fullCache[kind] = main.innerHTML;
            modalBody.innerHTML = fullCache[kind];
          })
          .catch(function () {
            modalBody.innerHTML = summaryHtml(m.summary) +
              '<p style="margin-top:1rem;">Não foi possível carregar o texto completo.</p>';
          });
      }
      function openLegal(k, e) {
        if (e) e.preventDefault();
        kind = k;
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        modalBody.innerHTML = '<p>Carregando…</p>';
        var ready = offerCache
          ? Promise.resolve(offerCache)
          : fetch('/api/planos_offer.php').then(function (r) { return r.ok ? r.json() : {}; });
        ready
          .then(function (data) {
            offerCache = data || {};
            showSummary();
          })
          .catch(function () {
            offerCache = {};
            showSummary();
          });
      }
      function closeLegal() {
        modal.hidden = true;
        document.body.style.overflow = '';
      }

      document.getElementById('checkout-open-termos').addEventListener('click', function (e) {
        openLegal('terms', e);
      });
      document.getElementById('checkout-open-privacy').addEventListener('click', function (e) {
        openLegal('privacy', e);
      });
      document.getElementById('legal-modal-close').addEventListener('click', closeLegal);
      fullBtn.addEventListener('click', function () {
        if (mode === 'full') showSummary();
        else showFull();
      });
      modal.addEventListener('click', function (e) { if (e.target === modal) closeLegal(); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !modal.hidden) closeLegal();
      });

      document.getElementById('checkout-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        const status = document.getElementById('checkout-status');
        const accepted = document.getElementById('terms_accepted').checked;
        if (!accepted) {
          status.textContent = 'Marque que concorda com os Termos e a Privacidade.';
          return;
        }
        status.textContent = 'Enviando…';
        try {
          const res = await fetch('/api/checkout_stub.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              plan: p,
              provider: provider,
              terms_accepted: true,
              company: document.getElementById('company').value,
              email: document.getElementById('email').value,
              whatsapp: document.getElementById('whatsapp').value,
            }),
          });
          const data = await res.json();
          if (!data.ok) {
            status.textContent = data.error || 'Falha';
            return;
          }
          status.textContent = data.message || 'Recebido.';
          if (data.checkout_url) {
            status.innerHTML =
              (data.message || 'Ok') + ' <a href="' + data.checkout_url + '">Pagar</a>';
          }
        } catch (_) {
          status.textContent = 'Falha de rede. Tente de novo.';
        }
      });
    })();
  </script>
</body>
</html>
