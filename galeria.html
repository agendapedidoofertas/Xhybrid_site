<body data-page="galeria">
  <div class="page">
    <div id="site-header"></div>

    <main>
      <section class="page-cover">
        <div class="page-cover__media" aria-hidden="true">
          <video data-video="video-galeria" muted loop playsinline preload="metadata"></video>
          <img data-img="hero" alt="" width="1408" height="1024" referrerpolicy="no-referrer">
        </div>
        <div class="container page-cover__content">
          <header class="page-header" style="margin:0;text-align:left;max-width:none;">
            <p class="eyebrow" data-site="gallery_eyebrow">Portfolio</p>
            <h1 class="font-display" data-site="gallery_title">Projetos</h1>
            <p data-site="gallery_subtitle">
              Sites e soluções que já entregamos. Toque em uma foto para ampliar.
            </p>
          </header>
        </div>
      </section>

      <div class="container" style="padding-bottom:4rem">
        <ul class="gallery" id="gallery"></ul>
      </div>
    </main>

    <div id="site-footer"></div>
  </div>
  <div id="fab-whatsapp"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada">
    <button type="button" class="lightbox__close" id="lightbox-close" aria-label="Fechar foto ampliada">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>

  </div>
