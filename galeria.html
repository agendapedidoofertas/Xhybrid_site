  <script>
    (function(){try{var d=document.documentElement;var k='xhybrid-theme';var t=localStorage.getItem(k);var ok=['marrom-claro','marrom-escuro','branco','preto','azul','rosa','verde','teal','amber','cinza','indigo','graphite','oceano','lime','vinho','cobre','slate','neon','berry','midnight','menta','peonia','lavanda','mostarda','gelo','sunset'];if(ok.indexOf(t)<0)t='preto';d.setAttribute('data-theme',t);var dark=['marrom-escuro','preto','azul','verde','teal','indigo','graphite','lime','vinho','cobre','slate','neon','berry','midnight'];if(dark.indexOf(t)>=0)d.classList.add('dark');var fk='xhybrid-font';var f=localStorage.getItem(fk);var foks=['tech','soft','editorial','saas','mono','display','geometric','classic','rounded','condensed'];if(foks.indexOf(f)<0)f='tech';d.setAttribute('data-font',f);var lk='xhybrid-layout';var l=localStorage.getItem(lk);var loks=['soft','sharp','bento','editorial','pill','compact','frame','magazine','loft','strip'];if(loks.indexOf(l)<0)l='soft';d.setAttribute('data-layout',l);var mk='xhybrid-media';var m=localStorage.getItem(mk);var moks=['classic','flip','hero-flip','about-flip','stack-media','stack-copy','center','media-wide','copy-wide','gallery-dense'];if(moks.indexOf(m)<0)m='classic';d.setAttribute('data-media',m);}catch(e){}})();

<body data-page="galeria">
  <div class="page">
    <div id="site-header"></div>

          <h1 class="font-display" data-site="gallery_title">Projetos</h1>

    </main>

    </figure>
