<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 108" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="robotoHeadBody" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="robotoHeadGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="62" y1="28" x2="62" y2="10" stroke="#ffffff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>
  <circle cx="62" cy="7" r="5" fill="#c8c8c8"/>
  <circle cx="62" cy="7" r="2" fill="#fff" opacity=".9"/>
  <!-- Head -->
  <rect x="12" y="28" width="100" height="72" rx="18" fill="url(#robotoHeadBody)" stroke="#ffffff" stroke-opacity=".22" stroke-width="2"/>
  <rect x="12" y="28" width="100" height="72" rx="18" fill="url(#robotoHeadGlass)"/>
  <!-- Visor -->
  <rect x="28" y="48" width="68" height="32" rx="10" fill="#050505" stroke="#ffffff" stroke-opacity=".12" stroke-width="1.5"/>
  <!-- Eyes (blink via CSS .roboto-eye) -->
  <g class="roboto-eye roboto-eye-l">
    <rect x="38" y="56" width="14" height="14" rx="4" fill="#e8e8e8"/>
    <rect x="41" y="59" width="5" height="5" rx="1.5" fill="#fff" opacity=".95"/>
  </g>
  <g class="roboto-eye roboto-eye-r">
    <rect x="72" y="56" width="14" height="14" rx="4" fill="#e8e8e8"/>
    <rect x="75" y="59" width="5" height="5" rx="1.5" fill="#fff" opacity=".95"/>
  </g>
  <!-- Serious mouth -->
  <line x1="48" y1="86" x2="76" y2="86" stroke="#ffffff" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
</svg>
